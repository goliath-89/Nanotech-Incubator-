# cargo-deny policy for both Rust workspaces (the engine and app/src-tauri).
# Run: cargo deny check            and
#      cargo deny --manifest-path app/src-tauri/Cargo.toml check
# Exceptions must name the advisory, say why, and carry a review date.
# See docs/SECURITY_PROCESS.md.

[graph]
all-features = false
# The platforms Strata ships on. Linux-only crates (the GTK stack used for
# local development) are not part of any release and are not judged here.
targets = [
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
# Format: { id = "RUSTSEC-YYYY-NNNN", reason = "why it does not affect Strata; review by YYYY-MM-DD" }
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "CC0-1.0",
  "BSL-1.0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
]

[licenses.private]
# Strata's own crates are not published.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
