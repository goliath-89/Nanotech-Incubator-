name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Build release
        run: cargo build --release -p strata-cli
      - name: Upload command-line build
        uses: actions/upload-artifact@v4
        with:
          name: strata-cli-${{ matrix.os }}
          path: |
            target/release/strata
            target/release/strata.exe
          if-no-files-found: error

  # Windows on ARM (Snapdragon laptops). The x64 build runs there too, but
  # under emulation.
  windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build release for ARM64
        run: cargo build --release -p strata-cli --target aarch64-pc-windows-msvc
      - name: Upload command-line build
        uses: actions/upload-artifact@v4
        with:
          name: strata-cli-windows-arm64
          path: target/aarch64-pc-windows-msvc/release/strata.exe
          if-no-files-found: error
