name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Build release
        run: cargo build --release -p strata-cli
      - name: Upload command-line build
        uses: actions/upload-artifact@v4
        with:
          name: strata-cli-${{ matrix.os }}
          path: |
            target/release/strata
            target/release/strata.exe
          if-no-files-found: error

  # Windows on ARM (Snapdragon laptops). The x64 build runs there too, but
  # under emulation.
  windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Build release for ARM64
        run: cargo build --release -p strata-cli --target aarch64-pc-windows-msvc
      - name: Upload command-line build
        uses: actions/upload-artifact@v4
        with:
          name: strata-cli-windows-arm64
          path: target/aarch64-pc-windows-msvc/release/strata.exe
          if-no-files-found: error

  # The desktop app: installers for Windows and macOS (unsigned until Day 75).
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            args: ""
          - os: windows-latest
            name: windows-arm64
            args: "--target aarch64-pc-windows-msvc"
            rust_target: aarch64-pc-windows-msvc
          - os: macos-latest
            name: macos-universal
            args: "--target universal-apple-darwin"
            rust_target: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install interface packages
        working-directory: app
        run: npm ci
      - name: Check interface
        working-directory: app
        run: npm run check
      - name: Build installers
        working-directory: app
        run: npx tauri build ${{ matrix.args }}
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: strata-app-${{ matrix.name }}
          path: |
            app/src-tauri/target/**/release/bundle/msi/*.msi
            app/src-tauri/target/**/release/bundle/nsis/*.exe
            app/src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
