name: CI

on:
  push:
  pull_request:

# Least privilege: jobs can read the code and nothing else.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings -D clippy::undocumented_unsafe_blocks
      - name: Test
        run: cargo test --all
      - name: Build release
        run: cargo build --release -p strata-cli
      - name: Upload command-line build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strata-cli-${{ matrix.os }}
          path: |
            target/release/strata
            target/release/strata.exe
          if-no-files-found: error

  # Windows on ARM (Snapdragon laptops). The x64 build runs there too, but
  # under emulation.
  windows-arm64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release for ARM64
        run: cargo build --release -p strata-cli --target aarch64-pc-windows-msvc
      - name: Upload command-line build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strata-cli-windows-arm64
          path: target/aarch64-pc-windows-msvc/release/strata.exe
          if-no-files-found: error

  # The interface in a browser with example data (app/tests, Playwright).
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install interface packages
        working-directory: app
        run: npm ci
      - name: Install the test browser
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: UI tests
        working-directory: app
        run: npm run test:ui
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-test-report
          path: app/playwright-report

  # The desktop app: installers for Windows and macOS (unsigned until Day 75).
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            args: ""
          - os: windows-latest
            name: windows-arm64
            args: "--target aarch64-pc-windows-msvc"
            rust_target: aarch64-pc-windows-msvc
          - os: macos-latest
            name: macos-universal
            args: "--target universal-apple-darwin"
            rust_target: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri
      - name: Install interface packages
        working-directory: app
        run: npm ci
      - name: Check interface
        working-directory: app
        run: npm run check
      - name: Build installers
        working-directory: app
        run: npx tauri build ${{ matrix.args }}
      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: strata-app-${{ matrix.name }}
          path: |
            app/src-tauri/target/**/release/bundle/msi/*.msi
            app/src-tauri/target/**/release/bundle/nsis/*.exe
            app/src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error
