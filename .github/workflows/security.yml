name: Security

# Runs on every push and pull request, every Monday (new advisories appear
# for code that has not changed), and on demand. See docs/SECURITY_PROCESS.md.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-dependencies:
    name: Rust dependencies (advisories, licences, sources)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest: [Cargo.toml, app/src-tauri/Cargo.toml]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          manifest-path: ${{ matrix.manifest }}
          arguments: --all-features
          command: check
          command-arguments: advisories bans licenses sources

  npm-dependencies:
    name: Interface dependencies (advisories, signatures)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install exactly what the lock file says, running no install scripts
        working-directory: app
        run: npm ci --ignore-scripts
      - name: Known vulnerabilities (any severity fails)
        working-directory: app
        run: npm audit --audit-level=low
      - name: Registry signatures and provenance
        working-directory: app
        run: npm audit signatures

  secrets:
    name: Secrets in the repository history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  hardening:
    name: App hardening and unsafe-code rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tauri settings, capabilities, file removal confined to strata-safety
        run: python3 tools/check-app-hardening.py
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - name: Security lints (every unsafe block documented, no unsafe where forbidden)
        run: cargo clippy --all-targets -- -D warnings -D clippy::undocumented_unsafe_blocks

  codeql:
    name: Code analysis (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # CodeQL reads the run it is part of
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      # Results are checked here, so the gate works whether or not GitHub
      # code scanning is switched on for the repository.
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: codeql-results
      - name: Fail on any finding
        run: python3 tools/codeql-gate.py codeql-results
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.language }}
          path: codeql-results
          if-no-files-found: ignore
