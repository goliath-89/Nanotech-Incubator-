# Keeps dependencies current so security fixes arrive as pull requests.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      engine: { patterns: ["*"] }
  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule: { interval: weekly, day: monday }
    groups:
      app-rust: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly, day: monday }
    groups:
      app-npm: { patterns: ["*"] }
    ignore:
      # svelte-check does not support TypeScript 7 yet (peer dependency);
      # revisit when it does. Security updates still come through.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions: { patterns: ["*"] }
