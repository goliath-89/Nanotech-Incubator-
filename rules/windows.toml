# App rules for Windows. Same format as macos.toml.
# Write paths with `/`. `C:` stands for the drive Windows is installed on.

[[app]]
name = "Google Chrome"
id = "Google.Chrome"
app = ["C:/Program Files/Google/Chrome", "C:/Program Files (x86)/Google/Chrome"]
data = ["~/AppData/Local/Google/Chrome/User Data"]
cache = [
  "~/AppData/Local/Google/Chrome/User Data/*/Cache",
  "~/AppData/Local/Google/Chrome/User Data/*/Code Cache",
]

[[app]]
name = "Microsoft Edge"
id = "Microsoft.Edge"
app = [
  "C:/Program Files (x86)/Microsoft/Edge",
  "C:/Program Files (x86)/Microsoft/EdgeCore",
  "C:/Program Files (x86)/Microsoft/EdgeUpdate",
]
data = ["~/AppData/Local/Microsoft/Edge/User Data"]
cache = [
  "~/AppData/Local/Microsoft/Edge/User Data/*/Cache",
  "~/AppData/Local/Microsoft/Edge/User Data/*/Code Cache",
]

[[app]]
name = "Microsoft Edge WebView2"
id = "Microsoft.EdgeWebView2Runtime"
app = ["C:/Program Files (x86)/Microsoft/EdgeWebView"]

[[app]]
