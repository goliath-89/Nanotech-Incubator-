# App rules for Windows. Same format as macos.toml.
# Write paths with `/`. `C:` stands for the drive Windows is installed on.

[[app]]
name = "Google Chrome"
id = "Google.Chrome"
app = ["C:/Program Files/Google/Chrome", "C:/Program Files (x86)/Google/Chrome"]
data = ["~/AppData/Local/Google/Chrome/User Data"]
cache = [
  "~/AppData/Local/Google/Chrome/User Data/*/Cache",
  "~/AppData/Local/Google/Chrome/User Data/*/Code Cache",
]

