[workspace]
resolver = "2"
exclude = ["app/src-tauri"]
members = ["crates/strata-core", "crates/strata-store", "crates/strata-safety", "crates/strata-classify", "crates/strata-reclaim", "crates/strata-mft", "crates/strata-pipeline", "crates/strata-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
rust-version = "1.82"

[profile.release]
lto = "thin"
codegen-units = 1
