[package]
name = "strata-cli"
description = "Command-line front end for the Strata scanner"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "strata"
path = "src/main.rs"

[dependencies]
strata-core = { path = "../strata-core" }
strata-store = { path = "../strata-store" }
strata-classify = { path = "../strata-classify" }
strata-reclaim = { path = "../strata-reclaim" }
strata-safety = { path = "../strata-safety" }
strata-mft = { path = "../strata-mft" }
strata-pipeline = { path = "../strata-pipeline" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
