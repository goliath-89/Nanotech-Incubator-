[package]
name = "strata-mft"
description = "Fast whole-volume scan by reading the NTFS Master File Table"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
strata-core = { path = "../strata-core" }

[dev-dependencies]
strata-classify = { path = "../strata-classify" }
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
