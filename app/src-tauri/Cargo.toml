[package]
name = "strata-app"
description = "Strata desktop app"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
rust-version = "1.89"
publish = false

# Kept out of the root workspace: building it needs the system webview
# libraries, which the engine crates do not.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strata-core = { path = "../../crates/strata-core" }
strata-store = { path = "../../crates/strata-store" }
strata-pipeline = { path = "../../crates/strata-pipeline" }
strata-safety = { path = "../../crates/strata-safety" }
strata-mft = { path = "../../crates/strata-mft" }
strata-classify = { path = "../../crates/strata-classify" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
